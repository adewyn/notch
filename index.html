<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notch</title>
  <meta name="description" content="Learn to sew, from your first stitch to drafting your own patterns.">
  <meta name="theme-color" content="#f6efe4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1916" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Notch">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Shared fills for every diagram (fabric right side, wrong side, and so on). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="pat-wrong" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="8" height="8" class="f-wrong"/>
        <line x1="0" y1="0" x2="0" y2="8" class="s-hatch"/>
      </pattern>
      <pattern id="pat-right" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" class="f-right"/>
        <circle cx="5" cy="5" r="1.1" class="f-dot"/>
      </pattern>
      <pattern id="pat-right2" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" class="f-right2"/>
        <circle cx="5" cy="5" r="1.1" class="f-dot"/>
      </pattern>
      <pattern id="pat-lining" width="9" height="9" patternUnits="userSpaceOnUse">
        <rect width="9" height="9" class="f-lining"/>
        <path d="M0 4.5h9M4.5 0v9" class="s-lining"/>
      </pattern>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" class="f-arrow"/>
      </marker>
      <marker id="arr-hi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" class="f-hi"/>
      </marker>
      <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M5 0V10" class="s-dim"/>
      </marker>
    </defs>
  </svg>

  <main id="app" aria-live="polite"></main>

  <nav id="tabs" aria-label="Main">
    <a href="#/path" data-tab="path"><svg viewBox="0 0 24 24"><path d="M5 19c3-1 3-5 7-6s4-5 7-7"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="13" r="2"/><circle cx="19" cy="6" r="2"/></svg><span>Path</span></a>
    <a href="#/measure" data-tab="measure"><svg viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8" rx="2"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/></svg><span>Measure</span></a>
    <a href="#/more" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></a>
  </nav>

  <div id="sheet-wrap" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
